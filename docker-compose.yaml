services:
  qdrant-mcp-server:
    image: qdrant-mcp-server:v3.3.5-unprivileged

    build:
      context: .
      dockerfile: Dockerfile
      args:
        QDRANT_MCP_BRANCH: ${QDRANT_MCP_BRANCH}

    env_file:
      - .env
    environment:
      HOME: /data
      HTTP_REQUEST_TIMEOUT_MS: 3600000
      # Logging
      LOG_LEVEL: "debug"
      
    container_name: qdrant-mcp

    restart: unless-stopped

    user: "${CONTAINER_UID}:${CONTAINER_GID}"

    volumes:
      - "${SOURCES_PATH:?SOURCES_PATH is required}:/sources:rw"
      - "${MCP_STATE_PATH:?MCP_STATE_PATH is required}:/data:rw"

    ports:
      - "3001:3000"

    networks:
      - rag

networks:
  rag:
    external: true
    name: "${RAG_NETWORK_NAME:-rag}"
